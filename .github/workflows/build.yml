name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar y guardar salida completa
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Adjuntar JAR compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEDsafio4Ruleta-Fabric-1.21.1-JAR
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Adjuntar log para diagnosticar errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-build-java21
          path: build.log
          if-no-files-found: warn
