name: Build Fabric 1.21.1 (Java 21)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Gradle wrapper and sources
        shell: bash
        run: |
          test -f gradlew || { echo "::error::Missing gradlew; upload extracted source files, not just ZIP"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "::error::Missing Gradle wrapper jar"; exit 1; }
          test -d src/main/resources || { echo "::error::Missing original resources"; exit 1; }
      - name: Compile with Java 21
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEDsafio4Ruleta-Fabric-1.21.1-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Upload compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: warn
