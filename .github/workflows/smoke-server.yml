name: Verificar arranque del servidor Fabric 1.21.1
on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/smoke-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Iniciar servidor dedicado y verificar Minecraft Done
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nmax-tick-time=-1\n' > run/server.properties
          chmod +x ./gradlew
          ./gradlew runServer --no-daemon --stacktrace > server-startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; pkill -P "$server_pid" 2>/dev/null || true' EXIT
          for ((i=0; i<160; i++)); do
            if grep -Eq 'Done \([0-9.,]+s\)!' server-startup.log; then
              echo "Servidor Fabric 1.21.1 iniciado: detectado 'Done'."
              grep -E 'Loading Minecraft|ruleta 1.1.0|Done \(' server-startup.log || true
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::El proceso del servidor terminó antes de llegar a Done."
              tail -120 server-startup.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::Servidor no listo tras 160 segundos."
          tail -120 server-startup.log
          exit 1
      - name: Guardar registro de arranque
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-servidor-dedicado
          path: |
            server-startup.log
            run/logs/latest.log
            run/crash-reports/*.txt
          if-no-files-found: warn
